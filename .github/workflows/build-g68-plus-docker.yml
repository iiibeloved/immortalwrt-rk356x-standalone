# =============================================================================
#  ImmortalWrt · rockchip/armv8 · NSY G68-PLUS (RK3568) · iStoreOS 风格
#
#  仓库   : https://github.com/iiibeloved/immortalwrt-rk356x-standalone  (branch: main)
#  目标   : rockchip / armv8 / DEVICE_nsy_g68-plus / aarch64_generic / Linux 6.6
#  基础   : defconfig/g68-plus-docker.config
#  附加   : defconfig/g68-plus-istoreos.config
#           (quickstart + luci-app-store, unishare, wolplus, lucky, rtbwmon,
#            filemanager, filetransfer, samba4, docker 引擎)
#
#  触发   : 1) Actions → Run workflow (可改 defconfig / 附加配置 / rootfs 大小)
#           2) push 到 main, 且改动 defconfig/ 或本文件
#           3) 每周六 02:00 (Asia/Shanghai) 定时重编, 跟踪 feeds 与插件更新
#
#  产物   : Actions run 页面底部 Artifacts
#           immortalwrt-g68-plus-<run_number>.zip
#             ├─ *-sdcard.img.gz        (SD / eMMC 直刷)
#             ├─ *-sysupgrade.img.gz    (dd 刷写升级) / *-sysupgrade.tar
#             ├─ *.manifest / sha256sums
#             └─ config.applied         (实际生效的 .config)
#
#  备注   : 本树 scripts/feeds 读取 ./feeds.conf (缺失时回退 feeds.conf.default),
#           故 CI 显式生成 feeds.conf; 同时导出 FEEDS_CONF 以兼容会读该变量的派生脚本。
# =============================================================================
name: Build G68-PLUS (iStoreOS style)

permissions:
  contents: write      # 构建成功后自动发布 Release 需要
  issues: write        # 构建失败时自动开 issue
  actions: read        # 读取本次 run 的失败步骤

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "基础 defconfig 路径"
        required: true
        default: defconfig/g68-plus-docker.config
      extra_config:
        description: "附加配置片段路径 (留空则只编译 defconfig)"
        required: false
        default: defconfig/g68-plus-istoreos.config
      rootfs_size:
        description: "rootfs 分区(只读系统分区)MB — 默认 200, 与 fork 派生源 defconfig 保持一致"
        required: true
        default: "200"
      rootfs_data_size:
        description: "rootfs_data 分区(可写 overlay: iStore/opkg 装包、docker 数据、配置)MB"
        required: true
        default: "4096"
      variant:
        description: "构建变体: full=带固件内置脚本; generic=纯应用+手动配置(不固化任何脚本)"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - generic
      upload_artifacts:
        description: "上传固件 artifact"
        type: boolean
        default: true
      publish_release:
        description: "构建成功后自动发布到 Release (生成免登录直链)"
        type: boolean
        default: true
      publish_tag:
        description: "可选：发布到指定 Release tag（留空=按日期新建；用于把 generic 产物追加进已有 Release）"
        required: false
        default: ""
  # 供脚本/CI 链式触发（如 full 成功后自动追编 generic），权限只需 contents:write
  repository_dispatch:
    types: [g68-build]
  push:
    branches: [ main ]
    paths:
      # 只按配置变更触发; 改 workflow / docs 不会自动重编(需要时手动 Run workflow)
      - "defconfig/g68-plus-docker.config"
      - "defconfig/g68-plus-istoreos.config"
  schedule:
    # 每周五 18:00 UTC = 每周六 02:00 Asia/Shanghai
    - cron: "0 18 * * 5"

concurrency:
  group: build-g68-plus-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

  # feeds: 本树读 feeds.conf, 这里显式声明路径
  FEEDS_CONF: feeds.conf
  # kenzok8/small-package: 提供 quickstart / luci-app-store / unishare / lucky /
  # wolplus / rtbwmon / webdav2 等 iStoreOS 生态插件
  FEED_SMALL: "src-git small https://github.com/kenzok8/small-package.git;main"
  # 单包仓库 (以本地 package/ 方式引入, 不作为 feed 全量索引)
  PKG_MENUSORT_URL: https://github.com/iiibeloved/luci-app-menusort
  PKG_PARTEXP_URL: https://github.com/sirpdboy/luci-app-partexp
  PKG_FILETRANSFER_URL: https://github.com/DustReliant/luci-app-filetransfer.git

  CONFIG_FILE: ${{ github.event.inputs.defconfig || 'defconfig/g68-plus-docker.config' }}
  EXTRA_CONFIG: ${{ github.event.inputs.extra_config || 'defconfig/g68-plus-istoreos.config' }}
  # 变体: full | generic（generic 会裁掉 files/ 里的固化脚本与配置）
  VARIANT: ${{ github.event.inputs.variant || github.event.client_payload.variant || 'full' }}
  # 注意: 该值会在「应用 defconfig 与附加配置」步骤里覆盖 defconfig 中的 CONFIG_TARGET_ROOTFS_PARTSIZE
  ROOTFS_SIZE: ${{ github.event.inputs.rootfs_size || '200' }}
  # rootfs_data 大小(传给 scripts/gen_image_generic.sh, 它读这个环境变量)
  ROOTFS_DATA_PARTSIZE: ${{ github.event.inputs.rootfs_data_size || '4096' }}
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    name: rockchip/armv8 · nsy_g68-plus
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      # ---------------------------------------------------------------------
      # 0. 环境准备
      # ---------------------------------------------------------------------
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: 修正内置脚本的可执行位
        run: |
          if [ -d files ]; then
            find files -type f \( -name '*.sh' -o -path '*/init.d/*' -o -path '*/uci-defaults/*' \) -exec chmod +x {} \;
            find files -type f -perm -u+x -printf '%m %p\n' | head -20
          else
            echo "没有 files/ 目录, 跳过"
          fi

      - name: 单元测试 (发布逻辑)
        run: |
          python3 -m unittest discover -s tests -v

      - name: 校验配置并打印目标
        run: |
          set -euo pipefail
          [ -f "$CONFIG_FILE" ] || { echo "::error::找不到基础 defconfig: $CONFIG_FILE"; exit 1; }
          echo "== 基础配置: $CONFIG_FILE"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE|ARCH_PACKAGES|KERNEL_PARTSIZE)=' "$CONFIG_FILE" || true

          # 基线指纹强校验: 与 docs/baseline.sha256 比对, 不一致直接失败(阻断构建)
          # 有意修改基线文件后, 执行 ./scripts/update-baseline.sh 重新生成并提交
          if [ -f docs/baseline.sha256 ]; then
            if sha256sum -c docs/baseline.sha256 --quiet >/dev/null 2>&1; then
              echo "== 基线指纹校验: 通过（仓库处于冻结基线）"
              echo "**基线指纹** ✅ 与 \`docs/baseline.sha256\` 一致" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::仓库内容与 docs/baseline.sha256 不一致 —— 若有意义修改, 请执行 ./scripts/update-baseline.sh 并提交后重试"
              sha256sum -c docs/baseline.sha256 2>&1 | grep -v ': OK$' | head -10 || true
              echo "**基线指纹** ❌ 与 \`docs/baseline.sha256\` 不一致（已阻断构建）" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          if [ -n "${EXTRA_CONFIG:-}" ] && [ -f "$EXTRA_CONFIG" ]; then
            echo "== 附加配置: $EXTRA_CONFIG"
            echo "   差异项: $(grep -cE '^CONFIG_[A-Z0-9_]+=' "$EXTRA_CONFIG" || true) 行"
          else
            echo "::warning::未找到附加配置, 仅编译基础 defconfig"
            echo "EXTRA_CONFIG=" >> "$GITHUB_ENV"
          fi

      - name: 安装编译依赖
        run: |
          set -euo pipefail
          # GitHub Azure 运行器对 security.ubuntu.com 解析不稳定，切到 Azure 内网镜像
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
          [ -f "$f" ] || continue
          sudo sed -i "s|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g;s|https://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g;s|http://security.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g;s|https://security.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g" "$f" || true
          done
          sudo apt-get clean
          for i in 1 2 3; do
            if sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
              gettext git libelf-dev libncurses-dev libssl-dev python3 rsync swig \
              unzip zlib1g-dev file wget curl ca-certificates ccache time \
              python3-pyelftools python3-setuptools python3-dev libgnutls28-dev \
              device-tree-compiler bc bzip2 patch perl cpio; then
              echo "依赖安装成功（第 $i 次尝试）"
              break
            fi
            echo "::warning::apt 失败，10 秒后重试（$i/3）"
            sleep 10
          done
          python3 -c 'import elftools' 2>/dev/null || python3 -m pip install --quiet pyelftools
          gcc --version | head -1
          ccache --version | head -1
          python3 --version
          python3 -c 'import elftools; print("pyelftools", elftools.__version__)'

      # ---------------------------------------------------------------------
      # 1. feeds: 先装官方 4 源 (defconfig 里 400+ 包依赖它们)
      # ---------------------------------------------------------------------
      - name: 生成 feeds.conf (官方 4 源)
        run: |
          set -euo pipefail
          cp feeds.conf.default feeds.conf
          echo "---- feeds.conf ----"
          cat feeds.conf

      - name: 更新并安装官方 feeds
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---------------------------------------------------------------------
      # 2. feeds: 再引入第三方源, 只安装需要的包
      #    (kenzok8/small-package 内含 docker/dnsmasq/firewall4 等与官方同名
      #     的包, 若 feeds install -a 会覆盖官方版本造成冲突, 故按名安装)
      # ---------------------------------------------------------------------
      - name: 引入第三方 feed 并选择性安装
        run: |
          set -euo pipefail
          grep -q '^src-git small ' feeds.conf || echo "$FEED_SMALL" >> feeds.conf
          echo "---- feeds.conf (final) ----"
          cat feeds.conf

          ./scripts/feeds update small

          PKGS="quickstart luci-app-quickstart luci-app-store luci-lib-taskd luci-lib-xterm taskd \
                unishare luci-app-unishare webdav2 luci-app-lucky lucky \
                luci-app-wolplus luci-app-rtbwmon \
                luci-app-homeassistant luci-app-eqosplus luci-app-timecontrol \
                luci-app-control-webrestriction luci-app-control-weburl"
          for p in $PKGS; do
            if ./scripts/feeds install "$p"; then
              :
            else
              echo "::warning::feeds install 失败: $p (该包可能被跳过)"
            fi
          done

      - name: 引入 luci-app-filetransfer (本地单包)
        run: |
          set -u
          if git clone --depth 1 "$PKG_FILETRANSFER_URL" package/luci-app-filetransfer; then
            rm -rf package/luci-app-filetransfer/.git   # 只保留包内容, 避免嵌套 git 树
            echo "== luci-app-filetransfer 已放入 package/"
          else
            echo "::warning::luci-app-filetransfer 拉取失败, 该包将被跳过"
            rm -rf package/luci-app-filetransfer
          fi

      - name: 引入 luci-app-partexp (本地单包, sirpdboy)
        run: |
          set -u
          if git clone --depth 1 "$PKG_PARTEXP_URL" /tmp/partexp-src; then
            mkdir -p package
            # 仓库结构: 根目录/luci-app-partexp/ 才是包本体
            if [ -d /tmp/partexp-src/luci-app-partexp ]; then
              cp -a /tmp/partexp-src/luci-app-partexp package/luci-app-partexp
            else
              cp -a /tmp/partexp-src package/luci-app-partexp
            fi
            rm -rf package/luci-app-partexp/.git
            echo "== luci-app-partexp 已放入 package/ (版本: $(grep -m1 '^PKG_VERSION' package/luci-app-partexp/Makefile | cut -d= -f2))"
          else
            echo "::warning::luci-app-partexp 拉取失败, 该包将被跳过"
            rm -rf package/luci-app-partexp /tmp/partexp-src
          fi

      # ---------------------------------------------------------------------
      # 3. 配置: defconfig + 附加片段 + rootfs 大小, 再由 make defconfig 归一化
      # ---------------------------------------------------------------------
      - name: 写入构建信息 /etc/g68-build
        run: |
          set -euo pipefail
          mkdir -p files/etc
          TAG="g68-plus-$(TZ=Asia/Shanghai date +%Y.%m.%d)"
          if [ "${VARIANT:-full}" = "generic" ]; then TAG="${TAG}-generic"; fi
          {
            echo "BUILD_TAG=${TAG}"
            echo "BUILD_RUN=${GITHUB_RUN_NUMBER}"
            echo "BUILD_COMMIT=${GITHUB_SHA:0:8}"
            echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BUILD_VARIANT=${VARIANT:-full}"
          } > files/etc/g68-build
          cat files/etc/g68-build

      - name: 引入 luci-app-menusort (独立仓库单包)
        run: |
          set -u
          if git clone --depth 1 "$PKG_MENUSORT_URL" /tmp/menusort-src; then
            mkdir -p package
            # 该仓库本身就是 LuCI 包（根目录有 Makefile / root / htdocs）
            cp -a /tmp/menusort-src/. package/luci-app-menusort/
            rm -rf package/luci-app-menusort/.git package/luci-app-menusort/.github
            echo "== luci-app-menusort 已放入 package/ (版本: $(grep -m1 '^PKG_VERSION' package/luci-app-menusort/Makefile | cut -d= -f2))"
          else
            echo "::warning::luci-app-menusort 拉取失败, 该包将被跳过"
            rm -rf package/luci-app-menusort /tmp/menusort-src
          fi

      - name: 按 variant 裁剪内置脚本/配置
        run: |
          set -euo pipefail
          echo "== variant: ${VARIANT:-full}"
          if [ "${VARIANT:-full}" = "generic" ]; then
            echo "generic 变体：移除全部固化脚本与自定义配置（只保留软件源配置）"
            rm -rf files/etc/init.d files/etc/uci-defaults files/etc/config
            rm -rf files/usr/bin files/usr/libexec
            echo "--- 保留的 files/ 内容 ---"
            find files -type f 2>/dev/null | sort || true
          else
            echo "full 变体：保留全部内置脚本与配置"
          fi

      - name: 应用 defconfig 与附加配置
        run: |
          set -euo pipefail
          cp "$CONFIG_FILE" .config

          if [ -n "${EXTRA_CONFIG:-}" ] && [ -f "$EXTRA_CONFIG" ]; then
            {
              echo ""
              echo "# ==== appended by .github/workflows/build-g68-plus-docker.yml ===="
              cat "$EXTRA_CONFIG"
            } >> .config
          fi

          # 命令行参数优先: 覆盖 rootfs 分区大小
          sed -i -E '/^CONFIG_TARGET_ROOTFS_PARTSIZE=/d' .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_SIZE}" >> .config

          # 归一化: 补齐依赖、丢弃不存在的符号 (未知符号在这里被静默移除)
          make defconfig

          # 强制关闭项: 附加配置里的 "# CONFIG_PACKAGE_x is not set" 单独再压一次,
          # 避免 kconfig 归一化时被依赖/默认值重新拉回 =y (实测踩过: ss-rust 仍被编译)
          if [ -n "${EXTRA_CONFIG:-}" ] && [ -f "$EXTRA_CONFIG" ]; then
            OFF=$(grep -oE '^# CONFIG_PACKAGE_[A-Za-z0-9_.+-]+ is not set$' "$EXTRA_CONFIG" \
                  | sed -e 's/^# CONFIG_PACKAGE_//' -e 's/ is not set$//' || true)
            if [ -n "$OFF" ]; then
              echo "需要强制关闭: $OFF"
              for p in $OFF; do
                sed -i -E "s|^CONFIG_PACKAGE_${p}=.*|# CONFIG_PACKAGE_${p} is not set|" .config
              done
              make defconfig
            fi
          fi

          echo "---- 生效目标 ----"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE|ARCH_PACKAGES|ROOTFS_PARTSIZE)=' .config
          echo "---- 已启用包数: $(grep -c '^CONFIG_PACKAGE_.*=y$' .config) ----"

      - name: 校验宿主机依赖 (make prereq)
        run: |
          make prereq

      - name: 校验附加包是否生效
        run: |
          set -uo pipefail
          missing=""
          {
            echo "### 编译配置"
            echo ""
            echo '```'
            grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE|ARCH_PACKAGES|ROOTFS_PARTSIZE)=' .config || true
            echo '```'
            echo ""
            echo "#### 附加软件包"
            echo ""
            echo "| 软件包 | 状态 |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${EXTRA_CONFIG:-}" ] && [ -f "$EXTRA_CONFIG" ]; then
            for p in $(grep -oE '^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$' "$EXTRA_CONFIG" \
                       | sed -e 's/^CONFIG_PACKAGE_//' -e 's/=y$//'); do
              if grep -qx "CONFIG_PACKAGE_${p}=y" .config; then
                echo "| \`${p}\` | ✅ |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "| \`${p}\` | ⚠️ 未启用 |" >> "$GITHUB_STEP_SUMMARY"
                missing="${missing} ${p}"
              fi
            done
          fi

          if [ -n "$missing" ]; then
            echo "::warning::以下附加包未能启用(依赖缺失/符号不存在):${missing}"
          else
            echo "全部附加包均已启用"
          fi

          # 预期关闭的包 (附加配置里的 "# CONFIG_PACKAGE_x is not set")
          # 注意: grep -o 拿到的是整行, 必须先剥掉 "# CONFIG_PACKAGE_" 前缀与 " is not set" 后缀
          if [ -n "${EXTRA_CONFIG:-}" ] && [ -f "$EXTRA_CONFIG" ]; then
            OFF=$(grep -oE '^# CONFIG_PACKAGE_[A-Za-z0-9_.+-]+ is not set$' "$EXTRA_CONFIG" 2>/dev/null \
                  | sed -e 's/^# CONFIG_PACKAGE_//' -e 's/ is not set$//' || true)
            for p in $OFF; do
                  if grep -qx "CONFIG_PACKAGE_${p}=y" .config; then
                    echo "| \`${p}\` | ⚠️ 预期关闭但仍启用 |" >> "$GITHUB_STEP_SUMMARY"
                    echo "::warning::附加配置要求关闭 ${p}, 但它仍是 =y (被其它包依赖拉起?)"
                  else
                    echo "| \`${p}\` | ⛔ 已按预期关闭 |" >> "$GITHUB_STEP_SUMMARY"
                  fi
            done
          fi

      # ---------------------------------------------------------------------
      # 4. 源码下载与编译
      # ---------------------------------------------------------------------
      - name: 缓存 dl 与 ccache
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
          key: openwrt-g68plus-${{ hashFiles('defconfig/g68-plus-docker.config', 'defconfig/g68-plus-istoreos.config') }}-${{ github.run_id }}
          restore-keys: |
            openwrt-g68plus-

      - name: 下载软件包源码
        run: |
          set +e
          make download -j"$(nproc)" 2>&1 | tee download.log
          make download -j1 V=s -k 2>&1 | tee -a download.log
          bad=$(grep -ciE 'download failed|failed to download' download.log)
          echo "下载失败条目: ${bad:-0}"
          du -sh dl 2>/dev/null || true
          if [ "${bad:-0}" -gt 0 ]; then
            echo "::warning::有 ${bad} 个源码包下载失败, 编译阶段可能报错 (见 download.log)"
          fi

      - name: 构建工具链 (tools + toolchain)
        run: |
          set -o pipefail
          make -j"$(nproc)" tools/install toolchain/install 2>&1 | tee toolchain.log
          TC=$(ls -d staging_dir/toolchain-* 2>/dev/null | head -1 || true)
          echo "工具链目录: ${TC:-未找到}"
          ls "$TC"/bin/*gcc 2>/dev/null | head -3 || true
          "$TC"/bin/aarch64-openwrt-linux-musl-gcc --version | head -1

      - name: 修复 rust vendor 校验并预编译 rust host
        run: |
          set -o pipefail
          if ! grep -qE '^CONFIG_PACKAGE_(rust|shadowsocks-rust)' .config; then
            echo "config 中未选中任何 rust 组件, 跳过 rust 构建 (预计节省约 2 小时)"
            exit 0
          fi
          RUST_TARGET=package/feeds/packages/rust/host/compile
          # 第一次: 只为触发解包; vendor checksum 问题会在一分钟内失败, 属预期
          make -j2 "$RUST_TARGET" 2>&1 | tee rust-host.log || true
          D=$(ls -d build_dir/*/host/rustc-*-src 2>/dev/null | head -1 || true)
          if [ -z "${D:-}" ]; then
            echo "::error::rust 源码未解包, 找不到 build_dir/*/host/rustc-*-src"
            exit 1
          fi
          echo "== 源码树: $D"
          echo "== vendor 内 Cargo.toml.orig 数量: $(find "$D/vendor" -maxdepth 3 -name 'Cargo.toml.orig' 2>/dev/null | wc -l)"
          echo "== cc-1.2.28 目录:"; ls -la "$D/vendor/cc-1.2.28" 2>/dev/null | head -12 || true
          python3 - "$D" <<'PY'
          import glob, json, os, sys
          root = sys.argv[1]
          crates = fixed = 0
          samples = []
          for cs in sorted(glob.glob(os.path.join(root, 'vendor', '*', '.cargo-checksum.json'))):
              crates += 1
              d = os.path.dirname(cs)
              try:
                  data = json.load(open(cs))
              except Exception:
                  continue
              files = data.get('files') or {}
              missing = [f for f in files if not os.path.exists(os.path.join(d, f))]
              if not missing:
                  continue
              fixed += len(missing)
              for f in missing:
                  files.pop(f, None)
              data['files'] = files
              with open(cs, 'w') as fh:
                  json.dump(data, fh, separators=(',', ':'))
              if len(samples) < 10:
                  samples.append(os.path.basename(d) + ' -> ' + ', '.join(missing[:3]))
          print('解包后 vendor 包数: %d, 清理缺失条目: %d' % (crates, fixed))
          for s in samples:
              print('  -', s)
          PY
          # 第二次: 真正编译 rust host
          if make -j2 "$RUST_TARGET" 2>&1 | tee -a rust-host.log; then
            echo "rust host 预编译通过"
            exit 0
          fi
          echo "::warning::rust host 预编译失败, 用 V=s 重跑取完整报错"
          timeout 1200 make -j1 V=s "$RUST_TARGET" 2>&1 | tee -a rust-host.log || true
          exit 1

      - name: 预编 u-boot 并归档 .config（供设备内 cat /etc/uboot.config 查询）
        shell: bash
        run: |
          set -euo pipefail
          # 先只编 u-boot（随后全量 make 会复用其 stamp，不重复编）
          if ! make -j"$(nproc)" package/boot/uboot-rockchip/compile V=s > /tmp/uboot-pre.log 2>&1; then
            echo "::warning::预编 u-boot 失败，继续全量构建（日志见下方）"
            tail -40 /tmp/uboot-pre.log || true
          fi
          UB_CFG=$(find build_dir -path '*u-boot-*/u-boot-*/.config' | grep -E 'nsy-g68' | head -1 || true)
          [ -n "$UB_CFG" ] || UB_CFG=$(find build_dir -path '*u-boot-*/.config' | head -1 || true)
          if [ -n "$UB_CFG" ]; then
            echo "u-boot .config: $UB_CFG"
            mkdir -p files/etc
            cp "$UB_CFG" files/etc/uboot.config
            cp "$UB_CFG" ../uboot.config
            echo "--- 关键项 ---"
            grep -E '^CONFIG_(ROCKCHIP_BOOT_MODE_REG|ADC|SPL_ADC|SARADC_ROCKCHIP|CMD_ROCKUSB)=' files/etc/uboot.config || true
          else
            echo "::warning::未找到 u-boot .config，跳过归档"
          fi

      - name: 编译固件
        run: |
          set -o pipefail
          if make -j"$(nproc)" 2>&1 | tee build.log; then
            echo "== 编译完成"
          else
            echo "::warning::并行编译失败, 以单线程加详细日志重试一次"
            make -j1 V=s 2>&1 | tee -a build.log
          fi

      # ---------------------------------------------------------------------
      # 5. 产物收集与上传
      # ---------------------------------------------------------------------
      - name: 记录 rootfs 占用 (squashfs 实际大小)
        run: |
          set -e
          SQ=$(ls build_dir/*/linux-*/root.squashfs 2>/dev/null | head -1 || true)
          if [ -z "${SQ:-}" ]; then
            echo "::warning::找不到 root.squashfs, 跳过占用统计"
            exit 0
          fi
          B=$(stat -c%s "$SQ")
          PART=$(( ${ROOTFS_SIZE} * 1024 * 1024 ))
          PCT=$(( B * 100 / PART ))
          echo "squashfs: $SQ"
          echo "实际大小: $(( B / 1024 / 1024 )) MiB | rootfs 分区: ${ROOTFS_SIZE} MiB | 占用 ${PCT}%"
          {
            echo "### rootfs 占用"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| squashfs 实际大小 | $(( B / 1024 / 1024 )) MiB |"
            echo "| rootfs 分区 | ${ROOTFS_SIZE} MiB |"
            echo "| 占用率 | ${PCT}% |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PCT" -ge 85 ]; then
            echo "::warning::squashfs 已占 rootfs 分区的 ${PCT}%, 建议把 rootfs_size 调大 (例如 ${ROOTFS_SIZE} -> 1024)"
          fi

      - name: 校验镜像分区表
        run: |
          set -e
          python3 - <<'PY'
          import glob, gzip, os, struct, sys

          imgs = sorted(glob.glob('bin/targets/rockchip/armv8/*.img.gz'))
          if not imgs:
              print('::error::没有找到 *.img.gz')
              sys.exit(1)
          # sdcard 镜像才是带 MBR 分区表的整盘镜像；sysupgrade 布局不同，优先排除
          sd = [p for p in imgs if 'sdcard' in p]
          img = (sd or imgs)[0]
          print('镜像:', img)
          with gzip.open(img, 'rb') as f:
              head = f.read(8 * 1024 * 1024)

          sig = head[440:444]
          print('MBR 磁盘签名:', sig)
          print('| 分区 | 起始 | 大小(MiB) |')
          print('| --- | --- | --- |')
          parts = []
          for i in range(4):
              e = head[446 + i * 16: 446 + (i + 1) * 16]
              if len(e) < 16 or e[4] == 0:
                  continue
              lba = struct.unpack('<I', e[8:12])[0]
              cnt = struct.unpack('<I', e[12:16])[0]
              size_mib = cnt * 512 / 1048576
              parts.append(size_mib)
              print(f'| p{i+1} | {lba*512/1048576:.0f} MiB | {size_mib:.0f} |')

          want_kernel = 16
          want_rootfs = int(os.environ.get('ROOTFS_SIZE', '200'))
          want_data = int(os.environ.get('ROOTFS_DATA_PARTSIZE', '4096'))
          print()
          print(f'期望: kernel≈{want_kernel} MiB, rootfs≈{want_rootfs} MiB, rootfs_data≈{want_data} MiB')
          ok = (len(parts) == 3
                and abs(parts[0] - want_kernel) <= 2
                and abs(parts[1] - want_rootfs) <= 2
                and abs(parts[2] - want_data) <= 2)
          if not ok:
              print('::error::分区大小与期望不符 (实际 kernel/rootfs/rootfs_data = '
                    + ', '.join(f'{p:.0f}' for p in parts) + ' MiB)')
              sys.exit(1)
          print('分区表校验通过')
          PY
          echo "---- 写入 Job Summary ----"
          {
            echo "### 镜像分区表"
            echo ""
            echo "| 分区 | 起始 | 大小 |"
            echo "| --- | --- | --- |"
            python3 - <<'PY'
          import glob, gzip, struct
          # 与上面校验段保持同一选图逻辑：sdcard 优先，避免打印 sysupgrade 的伪分区表
          imgs = sorted(glob.glob('bin/targets/rockchip/armv8/*.img.gz'))
          sd = [p for p in imgs if 'sdcard' in p]
          img = (sd or imgs)[0]
          with gzip.open(img, 'rb') as f:
              head = f.read(1024 * 1024)
          names = {0: 'kernel', 1: 'rootfs', 2: 'rootfs_data'}
          for i in range(3):
              e = head[446 + i * 16: 446 + (i + 1) * 16]
              lba = struct.unpack('<I', e[8:12])[0]
              cnt = struct.unpack('<I', e[12:16])[0]
              print(f"| `{names.get(i, i)}` | {lba*512/1048576:.0f} MiB | {cnt*512/1048576:.0f} MiB |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 收集固件
        if: always()
        run: |
          mkdir -p output
          T=bin/targets/rockchip/armv8
          if [ -d "$T" ]; then
            find "$T" -maxdepth 1 -type f \( \
                 -name '*.img.gz' -o -name '*.img' -o -name '*.tar.gz' \
                 -o -name '*sysupgrade*' -o -name '*.itb' -o -name '*.fit' \
                 -o -name '*.manifest' -o -name 'sha256sums' -o -name 'config.buildinfo' \
              \) -exec cp -v {} output/ \;
          fi
          cp -v .config output/config.applied 2>/dev/null || true
          cp -v ../uboot.config output/uboot.config 2>/dev/null || cp -v files/etc/uboot.config output/uboot.config 2>/dev/null || true
          echo "---- output ----"
          ls -lh output/ || true
          {
            echo ""
            echo "### 固件产物"
            echo ""
            echo '```'
            ls -lh output/ 2>/dev/null || echo "(无产物, 编译可能失败)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传固件 artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_artifacts != false }}
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-g68-plus-${{ github.run_number }}${{ (env.VARIANT == 'generic') && '-generic' || '' }}
          path: output/*
          retention-days: 15
          if-no-files-found: warn

      - name: 发布到 Release (免登录直链)
        id: release
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.publish_release != false) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 资产命名与 sha256sums 合并的纯逻辑（tests/test_release_append.py 覆盖）
          . scripts/release-append-lib.sh
          T=bin/targets/rockchip/armv8
          # 优先取 sysupgrade 镜像（同目录还可能有 sdcard.img.gz）
          IMG=$(ls "$T"/*sysupgrade.img.gz 2>/dev/null | head -1 || true)
          [ -n "${IMG:-}" ] || IMG=$(ls "$T"/*.img.gz 2>/dev/null | head -1 || true)
          if [ -z "${IMG:-}" ]; then
            echo "::warning::没有找到 *.img.gz, 跳过 Release 发布"
            exit 0
          fi
          # tag: 优先用 publish_tag（把 generic 追加进已有 Release）；否则按日期新建
          CREATE=1
          TAG="${{ inputs.publish_tag || github.event.client_payload.publish_tag }}"
          if [ -n "$TAG" ]; then
            CREATE=0
            echo "追加模式：发布到已有 Release $TAG"
          else
            TAG="g68-plus-$(TZ=Asia/Shanghai date +%Y.%m.%d)"
            if [ "${VARIANT:-full}" = "generic" ]; then
              TAG="${TAG}-generic"
            fi
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              TAG="${TAG}-r${GITHUB_RUN_NUMBER}"
            fi
          fi

          # generic 追加到 full 的同一个 Release 时，资产名不能与 full 冲突 -> 加 -generic 后缀
          # （sha256sums 的合并放到追加分支里做：需要先读 Release 上已有的条目再合并，不能本地覆盖）
          if [ "${VARIANT:-full}" = "generic" ] && [ "$CREATE" = "0" ]; then
            NEWNAME=$(release_asset_name "$IMG" "$VARIANT")
            if [ "$NEWNAME" != "$(basename "$IMG")" ]; then
              mv "$IMG" "$T/$NEWNAME"
              IMG="$T/$NEWNAME"
            fi
          fi
          PKGS=$(cat "$T"/*.manifest 2>/dev/null | grep -c ' - ' || true)
          PKGS=${PKGS:-0}
          KVER=$(sed -n 's/^CONFIG_LINUX_\([0-9]\)_\([0-9]*\)=y/\1.\2/p' .config | head -1 || true)
          SHA=$(sha256sum "$IMG" | cut -d' ' -f1)
          {
            echo "## ImmortalWrt · rockchip/armv8 · NSY G68-PLUS (RK3568)"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 构建 | [run #${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo "| 提交 | \`${GITHUB_SHA:0:8}\` |"
            echo "| 变体 | **${VARIANT:-full}** |"
            echo "| 内核 | Linux ${KVER:-6.6} |"
            echo "| 软件包 | ${PKGS} 个 |"
            echo "| 镜像 sha256 | \`${SHA}\` |"
            echo ""
            echo "### 下载"
            echo ""
            echo "- GitHub 直链（需能访问 GitHub）:"
            echo "  <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$IMG")>"
            echo "- 加速代理 1: <https://gh-proxy.com/${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$IMG")>"
            echo "- 加速代理 2: <https://ghfast.top/${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$IMG")>"
            echo "- 加速代理 3: <https://ghproxy.net/${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$IMG")>"
            echo ""
            echo "> 代理只是前置前缀，文件内容与 sha256 完全相同；任一链接下载后都用下面的 sha256sums 校验。"
            echo ""
            if [ "${VARIANT:-full}" = "generic" ]; then
              echo "> **generic 变体**：只集成应用包与软件源配置；**不含**任何固件内置脚本/自动配置。"
              echo "> 分区、挂载、docker 数据目录、LAN 地址等全部需要你**手动配置**（见 docs/first-boot-checklist.md）。"
              echo ""
            fi
            echo "### 集成内容"
            echo ""
            echo "- iStoreOS 风格: luci-app-quickstart + quickstart, luci-app-store + taskd/luci-lib-taskd/luci-lib-xterm"
            echo "- 共享/运维: unishare(samba4+webdav2), lucky, luci-app-wolplus, luci-app-rtbwmon"
            echo "- 文件管理: luci-app-filemanager, luci-app-filetransfer"
            echo "- Samba4: samba4-server + luci-app-samba4"
            echo "- Docker: dockerd / containerd / runc / docker（数据目录 /mnt/ext_relay/docker）"
            echo "- 存储: 首次启动自动拆分剩余空间 → ext_relay(50 GiB, docker) + Data(共享, iStore 安装选它)"
            echo "- NVMe: 自动检测并挂载到 /mnt/nvme0（ext4/xfs/btrfs/f2fs/exfat/ntfs3）"
            echo "- 代理组件: shadowsocks-rust 保留（sslocal/ssserver/ssmanager）, xray-core, v2ray-plugin"
            echo "- 内置 opkg 源: 官方 6 个 + iStoreOS 3 个（store/nas_luci/nas）"
            echo ""
            echo "### 刷机"
            echo ""
            echo '```bash'
            echo "sha256sum -c sha256sums --ignore-missing"
            echo "gunzip immortalwrt-rockchip-armv8-nsy_g68-plus-squashfs-sysupgrade.img.gz"
            echo "sudo dd if=immortalwrt-rockchip-armv8-nsy_g68-plus-squashfs-sysupgrade.img of=/dev/sdX bs=4M conv=fsync status=progress"
            echo '```'
            echo ""
            echo "也可在 LuCI「系统 → 备份/升级」直接上传 .img.gz。"
          } > /tmp/notes.md
          if [ "$CREATE" = "1" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "ImmortalWrt G68-PLUS · ${TAG}" \
              --notes-file /tmp/notes.md \
              "$IMG" "$T/sha256sums" "output/uboot.config"
          else
            # 追加资产：直接用 REST API（gh release upload 在部分情况下返回 404，用 REST 更稳）
            API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
            REL_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API/releases/tags/$TAG" | jq -r .id)
            [ -n "$REL_ID" ] && [ "$REL_ID" != "null" ] || { echo "::error::找不到 Release $TAG"; exit 1; }

            # --- sha256sums: 与 Release 上已有条目合并，不能覆盖（否则 full 的条目丢失）---
            ANAME="$(basename "$IMG")"
            # 只剔除本变体（-generic）的旧条目；不带后缀的那条属于 full 变体，必须保留
            EXIST_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API/releases/$REL_ID/assets" \
              | jq -r '.[] | select(.name=="sha256sums") | .id' | head -1)
            : > /tmp/sums.base
            if [ -n "${EXIST_ID:-}" ] && [ "$EXIST_ID" != "null" ]; then
              # 资产二进制下载需要 Accept: application/octet-stream
              # 必须校验 HTTP: 失败时把错误 JSON 当旧条目合并会产出不可用的 sums
              CODE=$(curl -sL -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/octet-stream' \
                "$API/releases/assets/$EXIST_ID" -o /tmp/sums.base) || CODE=000
              if [ "$CODE" != "200" ]; then
                echo "::error::下载已有 sha256sums 失败 (HTTP $CODE), 中止以免生成错误校验文件"
                exit 1
              fi
            fi
            { merge_sums /tmp/sums.base "$ANAME" "$(cd "$T" && sha256sum "$ANAME" | cut -d' ' -f1)"; } > /tmp/sums.new
            cp /tmp/sums.new "$T/sha256sums"
            echo "---- 合并后的 sha256sums ----"; cat "$T/sha256sums"

            for ASSET in "$IMG" "$T/sha256sums"; do
              ANAME="$(basename "$ASSET")"
              OLD_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API/releases/$REL_ID/assets" | jq -r --arg n "$ANAME" '.[]|select(.name==$n)|.id' | head -1)
              if [ -n "${OLD_ID:-}" ] && [ "$OLD_ID" != "null" ]; then
                curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$API/releases/assets/$OLD_ID"
                echo "已删除同名旧资产: $ANAME"
              fi
              CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/octet-stream' \
                --data-binary "@$ASSET" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$REL_ID/assets?name=$ANAME")
              echo "上传 $ANAME HTTP $CODE"
              case "$CODE" in
                201|200) ;;
                *) echo "::error::上传 $ANAME 失败 HTTP $CODE"; exit 1 ;;
              esac
            done

            # --- Release 说明：追加段落，幂等（重复追加时替换旧段落，不重复堆叠）---
            CUR=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API/releases/tags/$TAG" | jq -r .body)
            printf '%s\n' "$CUR" | awk '
              /^<!-- generic-append:begin -->$/ {skip=1; next}
              /^<!-- generic-append:end -->$/   {skip=0; next}
              !skip' > /tmp/body.txt
            {
              cat /tmp/body.txt
              echo ""
              echo "<!-- generic-append:begin -->"
              echo "### generic 变体（追加）"
              echo ""
              echo "- 资产：\`$(basename "$IMG")\`（sha256 \`$(sha256sum "$IMG" | cut -d' ' -f1)\`）"
              echo "- 构建：run #${GITHUB_RUN_NUMBER}，提交 \`${GITHUB_SHA:0:8}\`，软件包 ${PKGS} 个"
              echo "- 说明：**不含**任何固件内置脚本/自动配置；分区、挂载、docker 数据目录、LAN 等需手动配置（见 docs/first-boot-checklist.md）"
              echo "<!-- generic-append:end -->"
            } > /tmp/body.json
            jq -Rs '{body: .}' /tmp/body.json > /tmp/body_payload.json
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @/tmp/body_payload.json "$API/releases/$REL_ID")
            echo "更新 Release 说明 HTTP $CODE"
            case "$CODE" in
              200) ;;
              *) echo "::error::更新 Release 说明失败 HTTP $CODE"; exit 1 ;;
            esac
          fi
          echo "---- Release 资产 ----"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: full 成功后自动触发 generic 追编
        if: ${{ success() && env.VARIANT == 'full' && steps.release.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          echo "full 构建成功，触发 generic 追加到 $TAG"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=g68-build \
            -f client_payload[variant]=generic \
            -f client_payload[publish_tag]="$TAG"
          echo "dispatch 已受理（generic 会因 concurrency 排在本次之后）"

      - name: 构建失败时自动开 issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TITLE="CI 构建失败: ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          FAILED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(", ")' 2>/dev/null || echo "未知")
          BODY=$(cat <<EOF
          ## 构建失败

          | 项目 | 值 |
          | --- | --- |
          | 运行 | [#${GITHUB_RUN_NUMBER}](${RUN_URL}) |
          | 提交 | \`${GITHUB_SHA:0:8}\` |
          | 触发方式 | ${GITHUB_EVENT_NAME} |
          | 失败步骤 | ${FAILED} |

          ### 排查步骤

          1. 打开 [运行日志](${RUN_URL})，展开失败的那一步；
          2. 在该 run 页面底部下载 \`build-log-${GITHUB_RUN_NUMBER}\` artifact，
             内含 \`build.log\` / \`download.log\` / \`rust-host.log\` / \`toolchain.log\`；
          3. 对照 [失败排查速查表](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/build-guide.md#6-失败排查速查表)；
          4. 修复后手动 Run workflow 验证，本 issue 可关闭。

          > 该 issue 由 CI 自动创建；若已有同类未关闭 issue，则改为在其下追加评论。
          EOF
          )
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq '[.[] | select(.title | startswith("CI 构建失败")) | .number] | first // empty' 2>/dev/null || true)
          if [ -n "${EXISTING:-}" ]; then
            echo "已有未关闭的失败 issue #${EXISTING}, 追加评论"
            gh issue comment "${EXISTING}" --repo "$GITHUB_REPOSITORY" --body "$BODY" \
              || echo "::warning::追加评论失败"
          else
            echo "创建新的失败 issue"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" \
              || echo "::warning::创建 issue 失败 (仓库未开启 Issues?)"
          fi

      - name: 构建成功时自动关闭失败 issue
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          NUMS=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq '.[] | select(.title | startswith("CI 构建失败")) | .number' 2>/dev/null || true)
          if [ -z "${NUMS:-}" ]; then
            echo "没有未关闭的失败 issue"
            exit 0
          fi
          for n in $NUMS; do
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" \
              --body "构建已通过（run #${GITHUB_RUN_NUMBER}，提交 \`${GITHUB_SHA:0:8}\`），自动关闭。" || true
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed || true
            echo "已关闭 issue #$n"
          done

      - name: 上传编译日志 (仅失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            build.log
            download.log
            rust-host.log
            toolchain.log
          retention-days: 7
          if-no-files-found: ignore
