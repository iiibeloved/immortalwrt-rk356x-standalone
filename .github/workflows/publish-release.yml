# =============================================================================
#  把某次构建的 artifact 发布到 GitHub Release（提供免登录直链）
#
#  触发: 仅 workflow_dispatch（手动 / 由 API 触发），不会随 push 自动跑
#  用法: Actions → Publish firmware to Release → Run workflow
#        run_id   : 来源构建的 run id（如 42186516665）
#        artifact : 该 run 上传的 artifact 名称（如 immortalwrt-g68-plus-6）
#        tag      : 目标 Release tag（不存在会自动创建）
#
#  产物: https://github.com/<owner>/<repo>/releases/download/<tag>/<file>.img.gz
#        下载无需登录、不随 artifact 过期（默认保留到 Release 被删）
# =============================================================================
name: Publish firmware to Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "来源 run id"
        required: true
      artifact:
        description: "artifact 名称"
        required: true
      tag:
        description: "Release tag (不存在则创建)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: 发布固件到 Release
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: 下载构建产物 (GitHub 内网)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "${{ inputs.run_id }}" \
            --repo "${{ github.repository }}" \
            -n "${{ inputs.artifact }}" -D out
          echo "---- 产物内容 ----"
          find out -type f -printf '%10s  %p\n'

      - name: 解出固件与校验文件
        run: |
          set -euo pipefail
          find out -name '*.img.gz' -exec cp -v {} ./ \;
          if [ -f out/sha256sums ]; then cp -v out/sha256sums ./sha256sums; fi
          ls -lh ./*.img.gz ./sha256sums
          sha256sum ./*.img.gz

      - name: 检出逻辑脚本
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 上传到 Release (REST API, 复用 release-append-lib)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          . scripts/release-append-lib.sh
          API="$GITHUB_API_URL/repos/${GITHUB_REPOSITORY}"
          TAG="${{ inputs.tag }}"
          AUTH="Authorization: Bearer $GH_TOKEN"

          REL_ID=$(curl -s -H "$AUTH" "$API/releases/tags/$TAG" | jq -r '.id // empty')
          if [ -z "${REL_ID:-}" ]; then
            echo "Release 不存在, 创建 $TAG"
            REL_ID=$(curl -s -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"ImmortalWrt G68-PLUS · $TAG\",\"notes\":\"由构建 ${{ inputs.run_id }} 发布的固件\"}" \
              "$API/releases" | jq -r '.id // empty')
          fi
          [ -n "${REL_ID:-}" ] && [ "$REL_ID" != "null" ] || { echo "::error::无法获取/创建 Release $TAG"; exit 1; }

          # 合并已有 sha256sums（保留其它变体的条目），下载必须校验 HTTP
          EXIST_ID=$(curl -s -H "$AUTH" "$API/releases/$REL_ID/assets" \
            | jq -r '.[] | select(.name=="sha256sums") | .id' | head -1)
          : > /tmp/sums.base
          if [ -n "${EXIST_ID:-}" ] && [ "$EXIST_ID" != "null" ]; then
            CODE=$(curl -sL -w '%{http_code}' -H "$AUTH" -H 'Accept: application/octet-stream' \
              "$API/releases/assets/$EXIST_ID" -o /tmp/sums.base) || CODE=000
            [ "$CODE" = "200" ] || { echo "::error::下载旧 sha256sums 失败 HTTP $CODE"; exit 1; }
          fi
          cp /tmp/sums.base /tmp/sums.acc
          for f in ./*.img.gz; do
            merge_sums /tmp/sums.acc "$(basename "$f")" "$(sha256sum "$f" | cut -d' ' -f1)" > /tmp/sums.next
            mv /tmp/sums.next /tmp/sums.acc
          done
          cp /tmp/sums.acc sha256sums

          for ASSET in ./*.img.gz ./sha256sums; do
            ANAME=$(basename "$ASSET")
            OLD=$(curl -s -H "$AUTH" "$API/releases/$REL_ID/assets" \
              | jq -r --arg n "$ANAME" '.[]|select(.name==$n)|.id' | head -1)
            if [ -n "${OLD:-}" ] && [ "$OLD" != "null" ]; then
              curl -s -o /dev/null -X DELETE -H "$AUTH" "$API/releases/assets/$OLD"
              echo "已删除同名旧资产: $ANAME"
            fi
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "$AUTH" -H 'Content-Type: application/octet-stream' \
              --data-binary "@$ASSET" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$REL_ID/assets?name=$ANAME")
            echo "上传 $ANAME HTTP $CODE"
            case "$CODE" in
              201|200) ;;
              *) echo "::error::上传 $ANAME 失败 HTTP $CODE"; exit 1 ;;
            esac
          done
          echo "---- Release 资产 ----"
          gh release view "$TAG" --repo "${{ github.repository }}"
